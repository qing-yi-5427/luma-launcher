name: Build and validate
on:
  push:
    branches: [main, mimo]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Launcher.csproj -c Release
      - run: dotnet run --project Tests/Luma.SmokeTests.csproj -c Release
      - run: dotnet publish Launcher.csproj -p:PublishProfile=SingleFile
      - name: Verify single-file artifact
        shell: pwsh
        run: |
          $files = @(Get-ChildItem publish/win-x64 -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'Luma.exe') { throw 'Unexpected release contents' }
          $hash = (Get-FileHash publish/win-x64/Luma.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path publish/win-x64/Luma.exe.sha256 -Value "$hash  Luma.exe" -Encoding ascii -NoNewline
      - name: Performance gate (relative to baseline)
        shell: pwsh
        run: |
          # Soft gate: fail only when the artifact balloons past a hard ceiling.
          # Absolute idle-memory gates are hardware-dependent; see docs/PERFORMANCE.md.
          $size = (Get-Item publish/win-x64/Luma.exe).Length
          Write-Host "Artifact bytes: $size"
          if ($size -gt 100MB) { throw "Single-file artifact exceeded 100MB hard ceiling" }
          # This job asserts packaging hygiene; see docs/PERFORMANCE.md for measured latency.
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-win-x64
          if-no-files-found: error
          path: |
            publish/win-x64/Luma.exe
            publish/win-x64/Luma.exe.sha256

  branch-release:
    name: Publish branch pre-release
    needs: windows
    # PRs and version tags never publish a branch build. No untrusted PR code
    # runs in this write-enabled job; it only downloads the validated artifact.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mimo')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Luma-win-x64
          path: release
      - name: Verify and publish exact tested artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check Luma.exe.sha256)
          short_sha="${COMMIT_SHA:0:7}"
          tag="build-${BRANCH}-${BUILD_NUMBER}-${BUILD_ATTEMPT}-${short_sha}"
          title="Luma ${BRANCH} — build ${BUILD_NUMBER}.${BUILD_ATTEMPT} (${short_sha})"
          printf '%s\n' \
            "Automated Windows x64 single-file build from branch \`${BRANCH}\`." \
            "" \
            "Commit: ${COMMIT_SHA}" \
            "Build and tests: ${RUN_URL}" \
            "" \
            "Download Luma.exe and Luma.exe.sha256 below. No separate .NET installation is required." \
            "This is a development pre-release, not a stable release; it does not replace Latest." \
            "The executable retains the version declared in Launcher.csproj. Back up settings before testing." \
            "SHA-256 verifies download integrity, not a code-signing identity." > notes.md
          # Each attempt has its own tag; never overwrite previously published bytes.
          gh release create "$tag" release/Luma.exe release/Luma.exe.sha256 \
            --target "$COMMIT_SHA" --title "$title" --notes-file notes.md \
            --prerelease --latest=false
          echo "Release: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
